spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/hackathon_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:rawr1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

spring.h2.console.enabled=false

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
# CRITICAL FIX: Changed to false by default so cookies work on http://localhost without HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=12h

app.auth.mode=${APP_AUTH_MODE:INVITE}
app.auth.alice-email=${APP_AUTH_ALICE_EMAIL:alice@example.com}
app.auth.bob-email=${APP_AUTH_BOB_EMAIL:bob@example.com}
