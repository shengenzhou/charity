<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trade</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Place Trade</h1>

<div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>

<p>
    <strong>Market:</strong>
    <span th:text="${market.question}">Will it rain?</span>
</p>

<p>
    <strong>Outcome:</strong>
    <span th:text="${selectedOutcome}">YES</span>
</p>

<p>
    <strong>Side:</strong>
    <span th:text="${selectedSide}">BUY</span>
</p>

<p>
    <strong>Current price:</strong>
    <span th:text="${currentPrice}">0.42</span>
</p>

<p>
    <strong>Selected charity:</strong>
    <span th:text="${currentUser.selectedCharity != null ? currentUser.selectedCharity.name : 'None'}">Red Cross</span>
</p>

<form th:action="@{/trades}" th:object="${tradeRequest}" method="post">
    <input type="hidden" th:field="*{userId}" />
    <input type="hidden" th:field="*{marketId}" />
    <input type="hidden" th:field="*{outcome}" />
    <input type="hidden" th:field="*{side}" />

    <label for="quantity">Quantity</label>
    <input id="quantity" type="number" step="0.01" min="0.01" th:field="*{quantity}" required />
    <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" style="color:red;"></div>

    <br><br>

    <button type="submit">Submit Trade</button>
    <a th:href="@{/markets}">Cancel</a>
</form>
</body>
</html>
