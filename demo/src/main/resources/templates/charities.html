<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Charities</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Charities</h1>

<div th:if="${successMessage}" style="color: green;" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>

<p>
    Current selected charity:
    <strong th:text="${currentUser.selectedCharity != null ? currentUser.selectedCharity.name : 'None'}">Red Cross</strong>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Total Donations Received</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="charity : ${charities}">
        <td th:text="${charity.name}">Red Cross</td>
        <td th:text="${charity.description}">Humanitarian aid</td>
        <td th:text="${charity.totalDonationsReceived}">0.00</td>
        <td>
            <form th:action="@{/charities/select}" method="post">
                <input type="hidden" name="charityId" th:value="${charity.id}" />
                <button type="submit"
                        th:disabled="${currentUser.selectedCharity != null && currentUser.selectedCharity.id == charity.id}">
                    Select
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
