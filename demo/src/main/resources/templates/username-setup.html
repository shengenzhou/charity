<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Choose Username</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="page-shell">
    <main class="page access-page">
        <section class="hero access-hero">
            <div class="hero-panel">
                <span class="eyebrow">One-time setup</span>
                <h1 class="hero-title">Choose Your Username</h1>
                <p class="hero-copy">
                    Pick the name that should appear across the game, portfolio, and charity pages. You only need to do this once.
                </p>
                <div class="flash-stack">
                    <div class="flash success" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <div class="flash error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                </div>
            </div>

            <aside class="impact-panel">
                <span class="eyebrow" style="background: var(--charity-light); color: var(--primary);">Profile</span>
                <form class="stack-form" th:action="@{/access/username}" method="post">
                    <label class="field-label" for="username">Username</label>
                    <input id="username" type="text" name="username" minlength="2" maxlength="20" placeholder="Your name" autocomplete="nickname" />
                    <button class="btn" type="submit">Save username</button>
                </form>
            </aside>
        </section>
    </main>
</div>
</body>
</html>
