<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Markets</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Markets</h1>

<div th:if="${successMessage}" style="color: green;" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Question</th>
        <th>YES Price</th>
        <th>NO Price</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="market : ${markets}">
        <td th:text="${market.id}">1</td>
        <td th:text="${market.question}">Will it rain?</td>
        <td th:text="${market.yesPrice}">0.42</td>
        <td th:text="${market.noPrice}">0.58</td>
        <td th:text="${market.status}">OPEN</td>
        <td>
            <a th:href="@{/trades/new(marketId=${market.id}, outcome='YES', side='BUY')}">Buy YES</a>
            |
            <a th:href="@{/trades/new(marketId=${market.id}, outcome='NO', side='BUY')}">Buy NO</a>
            |
            <a th:href="@{/trades/new(marketId=${market.id}, outcome='YES', side='SELL')}">Sell YES</a>
            |
            <a th:href="@{/trades/new(marketId=${market.id}, outcome='NO', side='SELL')}">Sell NO</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
