<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="navbar(activePage)">
    <div class="top-ribbon">
        <strong th:text="${currentUser.selectedCharity != null ? currentUser.selectedCharity.name : 'Choose a charity'}">Red Cross</strong>
        receives every platform fee you generate.
        <span>
            Today:
            <strong th:text="${#numbers.formatDecimal(todayCharityDonations, 1, 2)}">0.00</strong>
            has gone to charity.
        </span>
    </div>
    <div class="app-nav-wrap">
        <nav class="app-nav">
            <a class="brand" th:href="@{/markets}">
                <span class="brand-mark" aria-hidden="true">
                    <svg
                        viewBox="0 0 40 40"
                        width="40"
                        height="40"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-label="PolyMarket">
                        <rect width="40" height="40" rx="9" fill="#1e2852" />
                        <rect x="5" y="27" width="7" height="9" rx="2" fill="white" fill-opacity="0.45" />
                        <rect x="15" y="21" width="7" height="15" rx="2" fill="white" fill-opacity="0.72" />
                        <rect x="25" y="16" width="7" height="20" rx="2" fill="white" />
                        <path
                                d="M28.5,15.5
                                   C28.5,15.5 22.5,10.5 22.5,8
                                   C22.5,5.8 24.2,4.5 26,4.5
                                   C27.1,4.5 28.1,5.3 28.5,6.3
                                   C28.9,5.3 29.9,4.5 31,4.5
                                   C32.8,4.5 34.5,5.8 34.5,8
                                   C34.5,10.5 28.5,15.5 28.5,15.5Z"
                                fill="white" />
                    </svg>
                </span>
                <span class="brand-copy">
                    <strong>PolyMarket</strong>
                    <span>Prediction markets with built-in giving</span>
                </span>
            </a>

            <div class="nav-links">
                <a class="nav-link" th:classappend="${activePage == 'markets'} ? ' active'" th:href="@{/markets}">Markets</a>
                <a class="nav-link" th:classappend="${activePage == 'games'} ? ' active'" th:href="@{/games}">Games</a>
                <a class="nav-link" th:classappend="${activePage == 'portfolio'} ? ' active'" th:href="@{/portfolio}">Portfolio</a>
                <a class="nav-link" th:classappend="${activePage == 'charities'} ? ' active'" th:href="@{/charities}">Charities</a>
            </div>

            <div class="nav-meta">
                <span class="balance-chip">
                    <span class="chip-label">Balance</span>
                    <strong th:text="${currentUser.balance}">1000.00</strong>
                </span>
                <span class="charity-chip">
                    <span class="chip-label">Charity</span>
                    <strong th:text="${currentUser.selectedCharity != null ? currentUser.selectedCharity.name : 'None selected'}">Red Cross</strong>
                </span>
                <div class="charity-chip">
                    <span class="chip-label">Player</span>
                    <strong th:text="${currentUser.name}">Alice</strong>
                </div>
                <form th:if="${!demoMode}" th:action="@{/access/logout}" method="post">
                    <button class="btn-secondary" type="submit">Log out</button>
                </form>
            </div>
        </nav>
    </div>
</th:block>
</body>
</html>
